
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shade</title>

    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h1>Shade</h1>

        <h3>Status Colors</h3>
        <p> Applied</p>
        <p> Under Review</p>
        <p> QA</p>
        <p> Interview</p>
        <p> Declined</p>
        <p> Accepted</p>

        <h3>Your Search</h3>
        <p>Total Applications: 147</p>
        <p>Interviews: 12</p>
        <p>Declined: 34</p>
    </aside>

    <!-- Main Content -->
    <main class="main">

        <!-- Header -->
        <header class="header">
            <h2>Jul - Oct 2026</h2>

            <div class="buttons">
                <button>Settings</button>
                <button>Analytics</button>
                <button class="add-btn">+ Add Application</button>
            </div>
        </header>

        <!-- Filters -->
        <div class="filters">
            <span>Filter:</span>
            <button>All</button>
            <button>Applied</button>
            <button>Under Review</button>
            <button>QA</button>
            <button>Interview</button>
            <button>Declined</button>
            <button>Accepted</button>
        </div>

        <!-- Calendar -->
        <div class="calendar">

            <!-- July -->
            <section class="month">
                <h3>July 2026</h3>
        
            </section>

            <!-- August -->
            <section class="month">
                <h3>August 2026</h3>
                
            </section>

            <!-- September -->
            <section class="month">
                <h3>September 2026</h3>

            </section>

            <!-- October -->
            <section class="month">
                <h3>October 2026</h3>

            </section>

        </div>

    </main>
</div>

</body>
</html>
